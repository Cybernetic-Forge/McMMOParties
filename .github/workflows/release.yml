name: Release

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    name: Create versioned release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute next semantic version
        id: version
        shell: bash
        run: |
          current_version=$(mvn \
            -q \
            -ntp \
            -Dstyle.color=never \
            help:evaluate \
            -Dexpression=project.version \
            -DforceStdout \
            | tail -n 1 \
            | tr -d '\r')

          # Remove suffixes such as -SNAPSHOT.
          current_version="${current_version%%-*}"

          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Maven version: $current_version" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current_version"

          base_branch="${{ github.event.pull_request.base.ref }}"

          if [ "$base_branch" = "dev" ]; then
            patch=$((patch + 1))
          elif [ "$base_branch" = "main" ]; then
            minor=$((minor + 1))
            patch=0
          else
            echo "Unsupported base branch: $base_branch" >&2
            exit 1
          fi

          next_version="${major}.${minor}.${patch}"
          next_tag="v${next_version}"

          echo "Current Maven version: $current_version"
          echo "Target branch: $base_branch"
          echo "Next version: $next_version"
          echo "Next tag: $next_tag"

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag already exists: $next_tag" >&2
            exit 1
          fi

          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Update Maven versions
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Update plugin.yml version
        run: |
          sed -i \
            "s/^version: .*/version: ${{ steps.version.outputs.version }}/" \
            src/main/resources/plugin.yml

      - name: Commit version changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pom.xml
          git add paper/pom.xml
          git add velocity/pom.xml
          git add universal/pom.xml
          git add src/main/resources/plugin.yml

          if git diff --staged --quiet; then
            echo "No version files changed; skipping commit."
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
            git push origin "${{ github.event.pull_request.base.ref }}"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clean corrupted Maven dependencies
        shell: bash
        run: |
          echo "Cleaning potentially corrupted Adventure dependencies..."

          rm -rf ~/.m2/repository/net/kyori/adventure-text-serializer-gson || true
          rm -rf ~/.m2/repository/net/kyori/adventure-text-serializer-legacy || true
          rm -rf ~/.m2/repository/net/kyori/adventure-text-logger-slf4j || true

          echo "Cleaning Maven cache for Paper API..."

          rm -rf ~/.m2/repository/io/papermc/paper || true

          echo "Running Maven dependency resolution with forced updates..."

          mvn -B -ntp dependency:purge-local-repository \
            -DreResolve=true \
            -DactTransitively=false || true

      - name: Build project
        run: |
          mvn -B -ntp -U clean package

      - name: Verify release JAR
        shell: bash
        run: |
          RELEASE_FILE="universal/target/McMMOParties-${{ steps.version.outputs.version }}.jar"

          if [ ! -f "$RELEASE_FILE" ]; then
            echo "Expected release file does not exist: $RELEASE_FILE" >&2
            echo "Available JAR files:" >&2
            find . -path "*/target/*.jar" -type f -print >&2
            exit 1
          fi

          echo "Release file found: $RELEASE_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: McMMOParties ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          generate_release_notes: true
          body: |
            Automated release for merged PR #${{ github.event.pull_request.number }}
            into `${{ github.event.pull_request.base.ref }}`.

            ${{ github.event.pull_request.title }}
          files: |
            universal/target/McMMOParties-${{ steps.version.outputs.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: 232N6Nha
          name: McMMOParties ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          channel: release
          environment: dedicated_server_only
          loaders: |-
            paper
            purpur
            velocity
          game-versions: |-
            1.21.x
            26.1.x
          files: universal/target/McMMOParties-${{ steps.version.outputs.version }}.jar
          primary-file: McMMOParties-${{ steps.version.outputs.version }}.jar
          changelog: |-
            Automated release for merged PR #${{ github.event.pull_request.number }}
            into `${{ github.event.pull_request.base.ref }}`.

            ${{ github.event.pull_request.title }}
