#Might be rather FORMULA, SCALING or LEVELING
Mode: LEVELING

formula:
  #Party Level Interval for radius expansion
  levelPerRadius: 5
  #Party Level Interval for Exp percentage expansion
  levelPerPercentage: 5
  formula-radius: x + (x/2) * 2
  # ^ 5 + (2.5 * 2) = 10 block Radius at level 5
  formula-percentage: x * 0.002
  # ^ 5 * 0.002 = 1% Exp sharing at level 5

#Static values of exp in % per players in a radius
#  - playerAmount,percent,radius
#  - 2,0.1,25                       <-- At 2 players, each gets 10% extra Exp in a 25 block radius
scaling:
  - 2,0.1,25
  - 3,0.25,25
  - 5,0.5,25
  - 7,0.6,25
  - 10,0.8,25


#Static values of exp in % and the effected radius per level
#  - level,percent,radius
#  - 5,0.05,25                      <-- At level 5 you have 5% Exp Sharing in a 25 block radius
leveling:
  - 10,0.01,10
  - 50,0.05,20
  - 100,0.1,30
  - 150,0.15,30
  - 200,0.2,35
  - 250,0.25,35
  - 300,0.3,40
  - 350,0.35,40
  - 400,0.4,45
  - 450,0.45,45
  - 500,0.5,50
  - 550,0.55,50
  - 600,0.6,55
  - 650,0.65,55
  - 700,0.7,60
  - 750,0.75,60
  - 800,0.8,65
  - 850,0.85,65
