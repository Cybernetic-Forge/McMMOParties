# Party level buffs configuration
# Each top-level key is a party level.
# Each entry under a level is a buff definition in the form:
#   BUFF_TYPE: VALUE
# or for ability duration:
#   ABILITY_DURATION: <AMOUNT>
# or for ability cooldown reduction:
#   ABILITY_COOLDOWN_REDUCTION:
#     <ABILITY>: <AMOUNT>
#
# Examples:
# 1:
#   EXP_SHARING_RATE: 5
#   EXP_SHARING_RADIUS: 25
# 3:
#   MEMBER_SLOTS: 2
# 7:
#   ABILITY_DURATION: 10
#
# Supported (suggested) buff keys:
# - EXP_SHARING_RATE: <percent>
# - EXP_SHARING_RADIUS: <blocks>
# - MEMBER_SLOTS: <count>
# - TRESOR_SIZE: <amount|-1 for unlimited>
# - ACCESS_PARTY_WAYPOINT: 1
# - ACCESS_PARTY_TRESOR: 1
# - ACCESS_PARTY_CHAT: 1
# - ABILITY_DURATION: <seconds>
# - ABILITY_COOLDOWN_REDUCTION: <ability|ALL>: <seconds>

# Level-based buffs (default)
Level:
  1:
    EXP_SHARING_RATE: 5
    EXP_SHARING_RADIUS: 25
  3:
    MEMBER_SLOTS: 2
    ACCESS_PARTY_CHAT: 1
  7:
    ABILITY_DURATION: 10
    ABILITY_COOLDOWN_REDUCTION:
      ALL: 5
    MEMBER_SLOTS: 1
    TRESOR_SIZE: 25000
  10:
    ACCESS_PARTY_TRESOR: 1
  12:
    ACCESS_PARTY_WAYPOINT: 1

# Skillpoint-based buffs (spent points map to levels below)
# Supported condition keys:
# - <MCMMO_SKILL>: <required cumulative level>
# - PartyLevel: <required party level>
# - BuffLevel.<BUFF_TYPE>: <required invested buff points>
# - BuffLevel.<BUFF_TYPE>.<ABILITY>: <required invested buff points> for ability-specific buffs
Skillpoints:
  EXP_SHARING_RATE:
    Configuration:
      Costs:
        1: 250.0
        2: 500.0
        3: 750.0
      Conditions:
        2:
          MINING: 250
        3:
          MINING: 500
          PartyLevel: 5
    1: 5
    2: 10
    3: 15
  EXP_SHARING_RADIUS:
    Configuration:
      Costs:
        1: 150.0
        2: 300.0
        3: 450.0
    1: 25
    2: 40
    3: 60
  TRESOR_SIZE:
    Configuration:
      Costs:
        1: 250.0
        2: 500.0
        3: 750.0
    1: 25000
    2: 50000
    3: 75000
  ACCESS_PARTY_WAYPOINT:
    Configuration:
      Costs:
        1: 250.0
    1: 1
  ACCESS_PARTY_TRESOR:
    Configuration:
      Costs:
        1: 250.0
    1: 1
  ACCESS_PARTY_CHAT:
    Configuration:
      Costs:
        1: 250.0
    1: 1
  ABILITY_DURATION:
    Configuration:
      Costs:
        1: 200.0
        2: 400.0
        3: 600.0
      Conditions:
        2:
          MINING: 300
    1: 3
    2: 6
    3: 9
  ABILITY_COOLDOWN_REDUCTION:
    ALL:
      Configuration:
        Costs:
          1: 250.0
          2: 500.0
          3: 750.0
        Conditions:
          2:
            MINING: 300
          3:
            BuffLevel:
              ABILITY_DURATION: 2
      1: 60
      2: 120
      3: 180
  MEMBER_SLOTS:
    Configuration:
      Costs:
        1: 500.0
        2: 1000.0
        3: 1500.0
      Conditions:
        3:
          TAMING: 400
    1: 2
    2: 2
    3: 3
  DUNGEON_INSTANCE_SLOTS:
    Configuration:
      Costs:
        1: 400.0
        2: 900.0
        3: 1800.0
      Conditions:
        2:
          TAMING: 250
        3:
          TAMING: 500
    1: 1
    2: 2
    3: unlimited

BuffMeta:
  EXP_SHARING_RATE:
    IconMaterial: EXPERIENCE_BOTTLE
  EXP_SHARING_RADIUS:
    IconMaterial: COMPASS
  MEMBER_SLOTS:
    IconMaterial: PLAYER_HEAD
  DUNGEON_INSTANCE_SLOTS:
    IconMaterial: TRIAL_KEY
  TRESOR_SIZE:
    IconMaterial: BUNDLE
  ACCESS_PARTY_WAYPOINT:
    IconMaterial: LODESTONE
  ACCESS_PARTY_TRESOR:
    IconMaterial: CHEST
  ACCESS_PARTY_CHAT:
    IconMaterial: WRITABLE_BOOK
  ABILITY_DURATION:
    IconMaterial: CLOCK
  ABILITY_COOLDOWN_REDUCTION:
    IconMaterial: AMETHYST_SHARD
    ALL:
      IconMaterial: AMETHYST_SHARD
