# Party buff configuration.
# The default config uses SKILLPOINTS mode:
# - Each party level grants 1 party skill point.
# - With PartyLevelCap: 100, a party can earn exactly 100 points to invest.
# - Setting PartyLevelCap: -1 in config.yml removes the cap and lets parties level forever.

# Legacy LEVEL mode support.
Level:
  1:
    EXP_SHARING_RATE: 3
    EXP_SHARING_RADIUS: 12
  5:
    ACCESS_PARTY_CHAT: 1
  10:
    MEMBER_SLOTS: 1
  15:
    ACCESS_PARTY_TRESOR: 1
  20:
    TRESOR_SIZE: 25000
  30:
    ABILITY_DURATION: 5
  40:
    MEMBER_SLOTS: 1
  50:
    ABILITY_COOLDOWN_REDUCTION:
      ALL: 5
  60:
    ACCESS_PARTY_WAYPOINT: 1
  75:
    DUNGEON_INSTANCE_SLOTS: 1
  90:
    EXP_SHARING_RATE: 5
    EXP_SHARING_RADIUS: 12
  100:
    ABILITY_DURATION: 10
    ABILITY_COOLDOWN_REDUCTION:
      ALL: 10

# Skillpoint mode.
# Supported condition keys:
# - <MCMMO_SKILL>: <required cumulative level>
# - PartyLevel: <required party level>
# - BuffLevel.<BUFF_TYPE>: <required invested buff points>
